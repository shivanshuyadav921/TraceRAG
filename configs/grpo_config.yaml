# GRPO (Group Relative Policy Optimization) Configuration
# Phase 2: Reinforcement Learning for reasoning enhancement

model:
  name: "microsoft/Phi-3-mini-4k-instruct"
  sft_checkpoint: "./outputs/sft/final"  # Load SFT model as starting point
  dtype: "bfloat16"
  trust_remote_code: true

lora:
  enabled: true
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

grpo:
  # Group generation settings
  group_size: 8              # Number of completions per prompt
  temperature: 0.7           # Sampling temperature for generation
  top_p: 0.95               # Nucleus sampling
  max_new_tokens: 512        # Max tokens per completion

  # Policy optimization
  clip_ratio: 0.2           # PPO-style clip ratio (epsilon)
  num_ppo_epochs: 1         # Inner PPO epochs per batch
  
  # KL divergence control
  kl_coeff: 0.04            # Initial KL penalty coefficient
  kl_target: 0.1            # Target KL divergence
  kl_annealing: true        # Anneal KL coeff over training
  kl_annealing_start: 0.02
  kl_annealing_end: 0.1
  kl_annealing_steps: 1000
  
  # Entropy bonus
  entropy_coeff: 0.01       # Encourage exploration
  
  # Advantage computation
  normalize_advantages: true

training:
  output_dir: "./outputs/grpo"
  num_epochs: 5
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6      # Lower LR for RL
  weight_decay: 0.01
  warmup_steps: 100
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  logging_steps: 5
  save_steps: 100
  eval_steps: 100
  save_total_limit: 5
  fp16: false
  bf16: true
  gradient_checkpointing: true

reward:
  # Combined reward weights
  outcome_weight: 0.7
  process_weight: 0.3
  
  # Outcome reward settings
  outcome:
    exact_match_score: 1.0
    numeric_close_score: 0.8
    numeric_tolerance: 0.01
    wrong_answer_score: 0.0
  
  # Process reward settings
  process:
    think_tag_score: 0.2
    step_score: 0.05
    max_step_score: 0.3
    no_repetition_score: 0.2
    answer_tag_score: 0.1
    length_penalty_threshold: 1000
    length_penalty_rate: 0.0001
    max_process_score: 0.5

curriculum:
  enabled: true
  difficulty_metric: "num_steps"  # Number of solution steps
  stages:
    - name: "easy"
      epochs: [1, 2]
      max_steps: 3
    - name: "medium"
      epochs: [3, 4]
      max_steps: 6
    - name: "hard"
      epochs: [5]
      max_steps: null  # All problems

data:
  datasets:
    - name: "gsm8k"
      split: "train"
      weight: 0.7
    - name: "aqua_rat"
      split: "train"
      weight: 0.3
  max_samples: null

wandb:
  project: "slm-reasoning-rl"
  run_name: "grpo-phi3-mini"
  enabled: true
